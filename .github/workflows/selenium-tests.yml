# This workflow will build a package using Maven and then publish it to GitHub packages when a release is created
# For more information see: https://github.com/actions/setup-java/blob/main/docs/advanced-usage.md#apache-maven-with-a-settings-path

name: Maven Package

on:
 workflow_dispatch:
  inputs:
   suite:
    description: 'Choose automation suite: RegressionSuite, SmokeSuite, SanitySuite'
    required: true
    type: choice
    default: "RegressionSuite"
    options:
      - "RegressionSuite"
      - "SmokeSuite"
      - "SanitySuite"

   browser:
    description: 'Chose browser suite: chrome, edge, firefox'
    required: true
    type: choice
    default: "chrome"
    options:
      - "chrome"
      - "edge"
      - "firefox"
jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: "maven"

    - name: Show Java and Maven versions
      run: |
        java --version
        mvn --version

    - name: Run automation suite
      run: mvn --batch-mode
           --no-transfer-progress
           clean verify
           -PCustomSuite
           -DciCd=true
           -Dbrowser=${{ inputs.browser }}
           -DsuiteXmlFile=suites/${{ inputs.suite }}
